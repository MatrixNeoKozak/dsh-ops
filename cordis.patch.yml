# Independent components. The shell payload defaults on only on Windows.
# Strict official-tool hiding is independent and enabled by default.
- insert:
    - id: dsh-ops-shell
      name: dsh-ops/shell
      disabled: !!js process.platform !== "win32"
      config:
        promptPolicy: true
        publishBashTool: true
        shellPolicy: advise
        allowSystemShellFallback: false
    - id: dsh-ops-file
      name: dsh-ops/file
      config:
        promptPolicy: true
        enableShellTools: false
        required: false
        toolCallTimeoutMs: 300000
    - id: dsh-ops-background
      name: dsh-ops/background
      disabled: true
      config:
        promptPolicy: true
        enableShellTools: true
        required: false
        toolCallTimeoutMs: 300000
    - id: dsh-ops-ptc
      name: dsh-ops/ptc
      disabled: true
      config:
        required: false
    - id: dsh-ops-hide-official
      name: dsh-ops/hide-official
      config:
        strict: true
        additionalOfficialTools: []
